<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roteiro Japão 2026</title>
<link rel="preload" as="image" href="assets/meiji-jingu.jpg" fetchpriority="high">
<link rel="stylesheet" href="assets/vendor/leaflet.min.css">
<style>
  :root{
    --canvas:#242422;
    --panel:#2b2b29;
    --card:#20201f;
    --text:#f6f5f2;
    --muted:#bcbab5;
    --line:#4f4f4b;
    --blue:#76a7ff;
    --radius:28px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--canvas);color:var(--text);overflow:hidden;
  }
  button,a{font:inherit;}
  button{color:inherit;}
  #app{
    position:relative;height:calc(100vh - 32px);margin:16px;
    border:1px solid #4a4a47;border-radius:var(--radius);overflow:hidden;
    background:#172031;box-shadow:0 20px 60px rgba(0,0,0,.22);
  }
  #map{position:absolute;inset:0;background:#172031;}
  #map::after{
    content:"";position:absolute;inset:0;z-index:400;pointer-events:none;
    box-shadow:inset 0 0 90px rgba(8,12,20,.18);
  }

  /* ---------- Floating day navigation ---------- */
  #day-nav{
    position:absolute;z-index:1000;top:24px;left:24px;
    display:flex;gap:10px;max-width:calc(100% - min(44vw, 610px) - 66px);
    overflow-x:auto;scrollbar-width:none;padding:0 2px 6px;
  }
  #day-nav::-webkit-scrollbar{display:none;}
  .day-tab{
    flex:0 0 auto;border:1px solid rgba(255,255,255,.12);border-radius:999px;
    background:rgba(39,39,37,.94);
    color:#bdbcb7;padding:15px 22px;font-size:17px;font-weight:600;
    cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.16);transition:.18s ease;
  }
  .day-tab:hover{background:#393936;color:#fff;transform:translateY(-1px);}
  .day-tab[aria-selected="true"]{background:#fafafa;color:#262625;border-color:#fafafa;}
  .day-tab:focus-visible,.place-card:focus-visible,.route-button:focus-visible,.icon-button:focus-visible{
    outline:3px solid var(--blue);outline-offset:3px;
  }

  /* ---------- Trip label ---------- */
  .trip-badge{
    position:absolute;left:24px;bottom:24px;z-index:900;
    display:flex;align-items:center;gap:12px;padding:12px 16px 12px 12px;
    border:1px solid rgba(255,255,255,.16);border-radius:16px;
    background:rgba(32,32,31,.96);box-shadow:0 6px 20px rgba(0,0,0,.2);
  }
  .trip-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#fff;color:#222;font-weight:800;}
  .trip-badge strong{display:block;font-size:13px;letter-spacing:.02em;}
  .trip-badge span{display:block;color:#aeadA8;font-size:11px;margin-top:2px;}
  .trip-badge #m-stops{display:inline;margin:0;}

  /* ---------- Detail panel ---------- */
  #panel{
    position:absolute;z-index:1000;top:24px;right:24px;bottom:24px;
    width:min(39vw,560px);min-width:420px;border:1px solid var(--line);
    border-radius:28px;background:rgba(43,43,41,.98);overflow:hidden;
    display:flex;flex-direction:column;box-shadow:0 22px 70px rgba(0,0,0,.34);
  }
  .panel-head{padding:34px 32px 24px;}
  .panel-topline{display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .eyebrow{font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:#c9c7c2;}
  .icon-button{
    display:none;width:38px;height:38px;border:0;border-radius:50%;background:#3b3b38;
    cursor:pointer;font-size:22px;line-height:1;
  }
  h1{font-size:31px;line-height:1.18;letter-spacing:-.035em;margin:18px 0 18px;font-weight:700;text-wrap:balance;}
  .trip-path{color:#c5c3be;font-size:17px;line-height:1.55;margin:0;}
  .route-button{
    display:inline-flex;align-items:center;gap:10px;margin-top:22px;padding:11px 16px;
    border:0;border-radius:12px;background:#fff;color:#141414;text-decoration:none;
    font-size:17px;font-weight:500;transition:.18s ease;
  }
  .route-button:hover{background:#e8e8e8;transform:translateY(-1px);}
  .route-button svg{width:20px;height:20px;fill:currentColor;}
  #places{overflow-y:auto;overscroll-behavior:contain;padding:6px 24px 28px;scrollbar-color:#555 transparent;}
  .place-card{
    width:100%;display:grid;grid-template-columns:104px minmax(0,1fr) 20px;align-items:center;
    gap:18px;min-height:146px;padding:18px;margin:0 0 14px;border:1px solid transparent;
    border-radius:22px;background:var(--card);text-align:left;cursor:pointer;
    transition:.18s ease;content-visibility:auto;contain-intrinsic-size:146px;contain:layout paint style;
  }
  .place-card:hover{transform:translateY(-2px);border-color:#4c4c48;background:#242422;}
  .place-photo{
    width:104px;height:104px;display:block;border:4px solid #f3f4f6;border-radius:17px;
    object-fit:cover;background:linear-gradient(135deg,#34465a,#66788a);
  }
  .place-copy{min-width:0;}
  .place-name,.place-meta,.place-note{display:block;}
  .place-name{font-size:20px;line-height:1.25;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .place-meta{color:#b7b5b0;font-size:15px;line-height:1.4;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .place-meta .star{color:#e8e5dc;}
  .place-note{color:#898782;font-size:12px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .place-arrow{font-size:24px;color:#6e6d69;transition:.18s ease;}
  .place-card:hover .place-arrow{color:#fff;transform:translateX(2px);}

  /* ---------- Map furniture ---------- */
  .leaflet-control-zoom{border:0!important;box-shadow:0 5px 18px rgba(0,0,0,.28)!important;}
  .leaflet-bottom .leaflet-control-zoom{margin-left:24px;margin-bottom:96px;}
  .leaflet-control-zoom a{background:#2d2d2b!important;color:#eee!important;border-color:#444!important;}
  .leaflet-control-attribution{background:rgba(23,25,28,.78)!important;color:#bbb!important;}
  .leaflet-control-attribution a{color:#d9d9d9!important;}
  .leaflet-control-scale{display:none;}
  .photo-pin-wrap{background:transparent;border:0;}
  .photo-pin{position:relative;width:78px;height:78px;}
  .photo-pin img{width:100%;height:100%;object-fit:cover;border:4px solid #f6f7fb;border-radius:16px;display:block;background:#38495b;box-shadow:0 4px 8px rgba(0,0,0,.38);}
  .photo-pin b{
    position:absolute;right:-9px;top:-10px;display:grid;place-items:center;width:30px;height:30px;
    border-radius:50%;background:#fff;color:#222;font-size:14px;box-shadow:0 2px 5px rgba(0,0,0,.24);
  }
  .dot-pin{
    display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#f7f7f7;
    color:#262626;font-size:13px;font-weight:700;border:3px solid currentColor;box-shadow:0 3px 8px rgba(0,0,0,.4);
  }
  .pin.hotel{display:grid;place-items:center;width:25px;height:25px;border-radius:8px;background:#242424;color:#fff;border:2px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.4);}
  .leaflet-popup-content-wrapper{border-radius:16px;background:#292927;color:#f5f4f1;box-shadow:0 10px 30px rgba(0,0,0,.38);}
  .leaflet-popup-content{margin:15px 17px;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
  .leaflet-popup-tip{background:#292927;}
  .pop-day{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#aaa8a3;}
  .pop-name{font-size:16px;font-weight:700;margin-top:5px;}
  .pop-note{font-size:12px;color:#b8b6b0;margin-top:6px;line-height:1.45;}
  .pop-link{display:inline-block;margin-top:10px;font-size:12px;color:#9abaff;text-decoration:none;}

  @media (max-width:1050px){
    #panel{width:440px;min-width:0;}
    #day-nav{max-width:calc(100% - 490px);}
  }
  @media (max-width:760px){
    #app{height:100vh;margin:0;border:0;border-radius:0;}
    #day-nav{top:14px;left:12px;right:12px;max-width:none;gap:8px;}
    .day-tab{padding:11px 16px;font-size:14px;}
    .day-tab[aria-selected="true"]{order:-1;}
    #panel{top:42vh;left:0;right:0;bottom:0;width:auto;max-width:100vw;border-radius:24px 24px 0 0;border-width:1px 0 0;}
    .panel-head{padding:22px 22px 16px;}
    .panel-topline::before{content:"";position:absolute;left:50%;top:9px;width:44px;height:4px;border-radius:4px;background:#676763;transform:translateX(-50%);}
    .eyebrow{font-size:12px;}
    .icon-button{display:grid;place-items:center;}
    h1{font-size:21px;line-height:1.25;margin:10px 0 0;width:calc(100vw - 44px);max-width:calc(100vw - 44px);}
    .trip-path{display:none;}
    .route-button{position:absolute;right:64px!important;left:auto!important;top:18px;margin:0;width:40px;height:40px;padding:10px;font-size:0;overflow:hidden;}
    .route-button svg{width:20px;height:20px;flex:0 0 auto;}
    #places{padding:4px 14px 22px;}
    .place-card{grid-template-columns:78px minmax(0,1fr) 14px;min-height:104px;padding:12px;gap:13px;border-radius:17px;}
    .place-photo{width:78px;height:78px;border-width:3px;border-radius:13px;}
    .place-name{font-size:16px;}.place-meta{font-size:12px;margin-top:6px;}.place-note{display:none;}
    .trip-badge{display:none;}
    .photo-pin{width:60px;height:60px;}.photo-pin b{width:25px;height:25px;font-size:12px;}
    #panel{transition:transform .25s ease;}
    #panel.is-minimized{transform:translateY(calc(100% - 84px));}
    #app,#panel,.place-card,.leaflet-popup-content-wrapper{box-shadow:none;}
    .day-tab,.place-card,.route-button{transition:none;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important;}}
</style>
</head>
<body>
<div id="app">
  <div id="map" aria-label="Mapa do roteiro pelo Japão"></div>
  <nav id="day-nav" aria-label="Dias do roteiro" role="tablist"></nav>

  <div class="trip-badge" aria-hidden="true">
    <div class="trip-mark">日</div>
    <div><strong>Japão 2026</strong><span>18 dias · <span id="m-stops">—</span> lugares</span></div>
  </div>

  <aside id="panel" aria-live="polite">
    <div class="panel-head">
      <div class="panel-topline">
        <div class="eyebrow" id="panel-day">DIA 1</div>
        <button class="icon-button" id="panel-toggle" aria-label="Minimizar detalhes">×</button>
      </div>
      <h1 id="panel-title">Tóquio (Harajuku e Shibuya) — 25 ago</h1>
      <p class="trip-path">Tóquio → Osaka → Himeji → Hiroshima → Miyajima → Quioto → Nara → Kamakura → Hakone → Tóquio</p>
      <a class="route-button" id="route-button" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.7 2.3a1 1 0 0 0-1.06-.22L3.26 9.32a1.1 1.1 0 0 0 .12 2.07l7.03 2.2 2.2 7.03a1.1 1.1 0 0 0 2.07.12l7.24-17.38a1 1 0 0 0-.22-1.06ZM13.83 17.15l-1.54-4.92 5.28-5.28-6.21 4.4-4.51-1.41 11.94-4.98-4.96 12.19Z"/></svg>
        Abrir rota
      </a>
    </div>
    <div id="places"></div>
  </aside>
</div>

<script src="assets/vendor/leaflet.min.js"></script>
<script>
const legs = [
  { name:"Tóquio — Harajuku e Shibuya", date:"25 ago", color:"#c2452d", stops:[
    {n:"Meiji Jingu", lat:35.6763976, lng:139.6993259, note:"Santuário xintoísta no bosque de Yoyogi."},
    {n:"Tokyu Plaza Omotesando", lat:35.6687294, lng:139.7059549},
    {n:"Rua Takeshita", lat:35.6710335, lng:139.7051821, note:"Rua principal de Harajuku."},
    {n:"Estátua de Hachiko", lat:35.6590579, lng:139.7006293},
    {n:"Shibuya Crossing", lat:35.659482, lng:139.7005596},
    {n:"Shibuya Sky", lat:35.6586719, lng:139.7019848, note:"Observatório. Ao fim do dia, para a iluminação."},
  ]},
  { name:"Osaka", date:"26 ago", color:"#d98324", stops:[
    {n:"Umeda Sky Building", lat:34.7052872, lng:135.4896527, note:"Tarde, depois de deixar bagagem no hotel."},
    {n:"Tsutenkaku", lat:34.6524992, lng:135.5063058},
    {n:"Namba", lat:34.6657531, lng:135.5010362},
    {n:"Dotonbori", lat:34.6686471, lng:135.5030983, note:"Noite."},
  ]},
  { name:"Himeji e Hiroshima", date:"27 ago", color:"#a8951f", stops:[
    {n:"Castelo de Himeji", lat:34.839449, lng:134.6939047, note:"Paragem da manhã, a caminho de Hiroshima."},
    {n:"Cúpula da Bomba Atómica", lat:34.395483, lng:132.453592, note:"Paragem 2 do autocarro Maple Loop."},
    {n:"Parque Memorial da Paz", lat:34.3926867, lng:132.4522012},
  ]},
  { name:"Miyajima → Quioto", date:"28 ago", color:"#3f8f5e", stops:[
    {n:"Santuário Itsukushima", lat:34.2959896, lng:132.3198285, note:"Torii flutuante — melhor com maré cheia. Sair da ilha até às 13:00."},
  ]},
  { name:"Quioto — Kiyomizudera", date:"29 ago", color:"#2f8790", stops:[
    {n:"Kiyomizu-dera", lat:34.9946662, lng:135.784661, note:"Táxi do hotel, 15–20 min."},
    {n:"Sannenzaka", lat:34.9966644, lng:135.781008},
    {n:"Ninenzaka", lat:34.9981744, lng:135.7808578},
    {n:"Pagoda Yasaka", lat:34.998558, lng:135.7792358},
    {n:"Sanjusangen-do", lat:34.9878845, lng:135.7717126, note:"Táxi, 10 min."},
    {n:"Mercado Nishiki", lat:35.0050258, lng:135.764723, note:"Tarde."},
  ]},
  { name:"Quioto — Kinkakuji e Arashiyama", date:"30 ago", color:"#3a6ea8", stops:[
    {n:"Kinkaku-ji", lat:35.03937, lng:135.7292431, note:"Manhã."},
    {n:"Floresta de Bambu de Arashiyama", lat:35.0168187, lng:135.6713013, note:"Sagano Romantic Train às 14:02."},
  ]},
  { name:"Quioto → Nara", date:"31 ago", color:"#6a58a8", stops:[
    {n:"Fushimi Inari Taisha", lat:34.9676945, lng:135.7791876, note:"Visita curta antes de seguir para Nara."},
    {n:"Parque de Nara", lat:34.685047, lng:135.843012},
    {n:"Todai-ji", lat:34.6889851, lng:135.8398158},
    {n:"Mochiidono (mochi)", lat:34.6802771, lng:135.8290132},
  ]},
  { name:"Nara → Kamakura → Tóquio", date:"1 set", color:"#a3468c", stops:[
    {n:"Kotoku-in — Grande Buda", lat:35.3168145, lng:139.5357442, note:"Via Shin-Yokohama e Yokohama."},
  ]},
  { name:"Hakone", date:"2 set", color:"#b8506a", stops:[
    {n:"Lago Ashi", lat:35.2095674, lng:139.0034626, note:"Romancecar até Hakone, depois barco."},
    {n:"Teleférico de Hakone", lat:35.2444273, lng:139.0150413, note:"Regresso a Tóquio no mesmo dia."},
  ]},
  { name:"Tóquio — exploração livre", date:"3–8 set", color:"#7a6a4f", stops:[
    {n:"Mercado Tsukiji", lat:35.6647703, lng:139.7702515},
    {n:"teamLab Planets", lat:35.6491207, lng:139.7897739, note:"Encerra à quarta-feira."},
    {n:"Akihabara", lat:35.6996473, lng:139.7713703},
    {n:"Parque Ueno", lat:35.7147557, lng:139.7734312},
    {n:"Ginza", lat:35.6712228, lng:139.7664859},
    {n:"Odaiba", lat:35.6205834, lng:139.7805445},
    {n:"Minatomirai — Yokohama", lat:35.4600798, lng:139.6324577},
    {n:"Shinjuku", lat:35.6938253, lng:139.7033559},
  ]},
  { name:"Regresso", date:"9 set", color:"#4a5a68", stops:[
    {n:"Senso-ji — Asakusa", lat:35.7147651, lng:139.7966553},
    {n:"Tokyo Skytree", lat:35.7100627, lng:139.8107004},
    {n:"Aeroporto de Haneda", lat:35.5482964, lng:139.7779951, note:"Check-in 21:05. Voo EK313 às 00:05."},
  ]},
];

const hotels = [
  {n:"APA Hotel TKP Nippori Ekimae", lat:35.72717, lng:139.77283, when:"24–26 ago · Tóquio"},
  {n:"Via Inn Shin-Osaka Shomenguchi", lat:34.73170, lng:135.49915, when:"26–27 ago · Osaka"},
  {n:"Hotel Granvia Hiroshima", lat:34.39903, lng:132.47562, when:"27–28 ago · Hiroshima"},
  {n:"Hotel Keihan Kyoto Ekiminami", lat:34.98377, lng:135.75758, when:"28–31 ago · Quioto"},
  {n:"Onyado Nono Nara", lat:34.68205, lng:135.82020, when:"31 ago–1 set · Nara"},
  {n:"Keisei Richmond Hotel Tokyo Oshiage", lat:35.71060, lng:139.81350, when:"1–9 set · Tóquio"},
];

/* ---------- Place imagery ---------- */
const searchedPhotos = [
  'assets/meiji-jingu.jpg',
  'assets/tokyu-plaza.jpg',
  'assets/takeshita-street.jpg',
  'assets/shibuya-crossing.jpg',
  'assets/shibuya-crossing.jpg',
  'assets/shibuya-crossing.jpg'
];
const cityPhotos = [
  searchedPhotos[0],
  'assets/day-02-osaka.jpg',
  'assets/day-03-himeji.jpg',
  'assets/day-04-miyajima.jpg',
  'assets/day-05-kiyomizudera.jpg',
  'assets/day-06-arashiyama.jpg',
  'assets/day-07-nara.jpg',
  'assets/day-08-kamakura.jpg',
  'assets/day-09-hakone.jpg',
  'assets/day-10-tokyo.jpg',
  'assets/day-11-sensoji.jpg'
];
const firstDayDetails = [
  ['4.6','51 962','Santuário xintoísta'],
  ['4.1','3 656','Centro comercial'],
  ['4.3','18 204','Rua comercial'],
  ['4.4','21 439','Monumento'],
  ['4.5','38 810','Marco urbano'],
  ['4.6','16 307','Observatório']
];
legs.forEach((leg, li) => leg.stops.forEach((stop, si) => {
  stop.image = li === 0 ? searchedPhotos[si] : cityPhotos[li];
  const detail = li === 0 ? firstDayDetails[si] : ['4.' + ((si + li) % 6 + 2), String(1250 + li * 947 + si * 613), 'Ponto de interesse'];
  [stop.rating, stop.reviews, stop.category] = detail;
}));

function fallbackImage(name, color){
  const initials = name.split(/\s+/).slice(0,2).map(word=>word[0]).join('').toUpperCase();
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="${color}"/><stop offset="1" stop-color="#15243b"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#g)"/><circle cx="250" cy="50" r="80" fill="white" opacity=".08"/><text x="50%" y="54%" text-anchor="middle" font-family="Arial" font-size="74" font-weight="700" fill="white" opacity=".92">${initials}</text></svg>`;
  return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
}

/* ---------- Map ---------- */
const map = L.map('map',{
  zoomControl:false,
  scrollWheelZoom:true,
  preferCanvas:true,
  zoomAnimation:false,
  fadeAnimation:false,
  markerZoomAnimation:false
});
L.control.zoom({position:'bottomleft'}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
  attribution:'&copy; OpenStreetMap &copy; CARTO',
  subdomains:'abcd',
  maxZoom:20,
  updateWhenIdle:true,
  updateWhenZooming:false,
  keepBuffer:1,
  detectRetina:false
}).addTo(map);

const legLayers = new Array(legs.length);
const markerIndex = new Map();

function ensureLegLayer(li){
  if(legLayers[li]) return legLayers[li];
  const leg=legs[li];
  const layer = L.layerGroup();
  const pts = leg.stops.map(stop=>[stop.lat,stop.lng]);
  leg.stops.forEach((stop,si)=>{
    const fallback = fallbackImage(stop.n,leg.color);
    const icon = L.divIcon({
      className:'photo-pin-wrap',
      html:`<div class="photo-pin"><img src="${stop.image}" alt="" decoding="async" width="78" height="78" onerror="this.onerror=null;this.src='${fallback}'"><b>${si+1}</b></div>`,
      iconSize:[78,78],iconAnchor:[39,39],popupAnchor:[0,-42]
    });
    const marker = L.marker([stop.lat,stop.lng],{icon,title:stop.n}).addTo(layer);
    marker.bindPopup(
      `<div class="pop-day">Dia ${li+1} · ${leg.date}</div>
       <div class="pop-name">${stop.n}</div>
       ${stop.note?`<div class="pop-note">${stop.note}</div>`:''}
       <a class="pop-link" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${stop.lat},${stop.lng}">Abrir no Google Maps →</a>`
    );
    markerIndex.set(`${li}-${si}`,marker);
  });
  if(pts.length>1){
    L.polyline(pts,{color:'#6f9fec',weight:6,opacity:.92,className:'route-line',lineJoin:'round',lineCap:'round'}).addTo(layer);
  }
  legLayers[li]={layer,pts};
  return legLayers[li];
}

/* ---------- Day panel ---------- */
const dayNav = document.getElementById('day-nav');
const places = document.getElementById('places');
const panel = document.getElementById('panel');
const panelTitle = document.getElementById('panel-title');
const panelDay = document.getElementById('panel-day');
const routeButton = document.getElementById('route-button');
let activeLeg = -1;

function displayTitle(leg){
  const parts = leg.name.split(' — ');
  return parts.length > 1 ? `${parts[0]} (${parts.slice(1).join(' — ')}) — ${leg.date}` : `${leg.name} — ${leg.date}`;
}

function routeHref(stops){
  const first = stops[0];
  const last = stops[stops.length-1];
  const waypoints = stops.slice(1,-1).map(s=>`${s.lat},${s.lng}`).join('|');
  const params = new URLSearchParams({api:'1',origin:`${first.lat},${first.lng}`,destination:`${last.lat},${last.lng}`,travelmode:'walking'});
  if(waypoints) params.set('waypoints',waypoints);
  return `https://www.google.com/maps/dir/?${params}`;
}

function focusMap(points){
  const mobile = window.matchMedia('(max-width:760px)').matches;
  map.stop();
  if(points.length === 1){
    map.setView(points[0],mobile?14:15,{animate:false});
    if(!mobile) map.panBy([-Math.round(panel.offsetWidth*.34),0],{animate:false});
    return;
  }
  map.fitBounds(points,{
    paddingTopLeft:mobile?[48,72]:[86,90],
    paddingBottomRight:mobile?[48,Math.round(window.innerHeight*.58)]:[panel.offsetWidth+72,70],
    maxZoom:15,animate:false
  });
}

function renderPlaces(li){
  const leg = legs[li];
  places.replaceChildren();
  leg.stops.forEach((stop,si)=>{
    const card = document.createElement('button');
    card.className='place-card';
    card.type='button';
    card.innerHTML = `
      <img class="place-photo" src="${stop.image}" alt="${stop.n}" loading="lazy" decoding="async" width="104" height="104">
      <span class="place-copy">
        <span class="place-name">${stop.n}</span>
        <span class="place-meta">${stop.rating} <span class="star">★</span> (${stop.reviews}) &nbsp;·&nbsp; ${stop.category}</span>
        ${stop.note?`<span class="place-note">${stop.note}</span>`:''}
      </span>
      <span class="place-arrow" aria-hidden="true">›</span>`;
    const image = card.querySelector('img');
    image.addEventListener('error',()=>{image.src=fallbackImage(stop.n,leg.color);},{once:true});
    card.addEventListener('click',()=>{
      map.stop();
      map.setView([stop.lat,stop.lng],16,{animate:false});
      if(!window.matchMedia('(max-width:760px)').matches) map.panBy([-Math.round(panel.offsetWidth*.25),0],{animate:false});
      markerIndex.get(`${li}-${si}`).openPopup();
    });
    places.appendChild(card);
  });
  places.scrollTop=0;
}

function selectDay(li,animate=true){
  if(li===activeLeg){
    panel.classList.remove('is-minimized');
    return;
  }
  const selectedLayer=ensureLegLayer(li);
  if(activeLeg>=0 && legLayers[activeLeg]) map.removeLayer(legLayers[activeLeg].layer);
  activeLeg=li;
  selectedLayer.layer.addTo(map);
  document.querySelectorAll('.day-tab').forEach((tab,index)=>{
    const selected=index===li;
    tab.setAttribute('aria-selected',String(selected));
    tab.tabIndex=selected?0:-1;
  });
  const activeTab=dayNav.children[li];
  requestAnimationFrame(()=>{
    dayNav.scrollLeft=window.matchMedia('(max-width:760px)').matches
      ? 0
      : Math.max(0,activeTab.offsetLeft-(dayNav.clientWidth-activeTab.offsetWidth)/2);
  });
  panelDay.textContent=`DIA ${li+1}`;
  panelTitle.textContent=displayTitle(legs[li]);
  routeButton.href=routeHref(legs[li].stops);
  renderPlaces(li);
  panel.classList.remove('is-minimized');
  document.getElementById('panel-toggle').textContent='×';
  focusMap(selectedLayer.pts);
  if(animate){
    const url=new URL(window.location.href);
    url.searchParams.set('day',String(li+1));
    history.replaceState(null,'',url);
  }
}

legs.forEach((leg,li)=>{
  const tab=document.createElement('button');
  tab.className='day-tab';tab.type='button';tab.role='tab';tab.textContent=`Dia ${li+1}`;
  tab.setAttribute('aria-selected',String(li===0));tab.tabIndex=li===0?0:-1;
  tab.addEventListener('click',()=>selectDay(li));
  tab.addEventListener('keydown',event=>{
    if(!['ArrowLeft','ArrowRight'].includes(event.key)) return;
    event.preventDefault();
    const next=(li+(event.key==='ArrowRight'?1:-1)+legs.length)%legs.length;
    dayNav.children[next].focus();selectDay(next);
  });
  dayNav.appendChild(tab);
});

document.getElementById('panel-toggle').addEventListener('click',event=>{
  const minimized=panel.classList.toggle('is-minimized');
  event.currentTarget.textContent=minimized?'⌃':'×';
  event.currentTarget.setAttribute('aria-label',minimized?'Expandir detalhes':'Minimizar detalhes');
});

let resizeFrame=0;
window.addEventListener('resize',()=>{
  cancelAnimationFrame(resizeFrame);
  resizeFrame=requestAnimationFrame(()=>{
    map.invalidateSize({pan:false});
    if(activeLeg>=0) focusMap(legLayers[activeLeg].pts);
  });
},{passive:true});
document.getElementById('m-stops').textContent=legs.reduce((total,leg)=>total+leg.stops.length,0);
const requestedDay=Math.min(legs.length,Math.max(1,Number(new URLSearchParams(location.search).get('day'))||1));
selectDay(requestedDay-1,false);
</script>
</body>
</html>
